[project]
name = "ndvi-forecasting"
version = "0.1.0"
description = "NDVI drought forecasting for India — TFT + frozen Prithvi-EO-2.0-300M (LoRA)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

# Pinned to the validated environment (Python 3.11, CUDA 12.8, linux-x86_64).
# torch==2.10.0 from PyPI IS the +cu128 (CUDA 12.8) build on linux — GPU works
# out of the box, no special index. einops+timm are needed by the vendored
# Prithvi arch (prithvi_mae.py), which the loader imports at runtime.
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "rasterio==1.4.4",
  "earthengine-api==1.7.22",
  "requests==2.34.2",
  "retry-requests==2.0.0",
  "python-dateutil==2.9.0.post0",
  "einops==0.8.2",
  "timm==1.0.27",
  "peft==0.19.1",
  "safetensors==0.8.0",
  "fastapi==0.135.3",
  "uvicorn==0.44.0",
  "pydantic==2.12.5",
]

[project.optional-dependencies]
# extra tools used only by training/ (fine-tune + eval plots)
train = [
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "tqdm==4.68.3",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ndvi_core is the importable package; inference/ and training/ are run as scripts.
packages = ["ndvi_core"]
